<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="40%" style="stop-color:#1a0a0a"/>
      <stop offset="70%" style="stop-color:#2d0a0a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#ff6b6b;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#ff6b6b" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#ff6b6b" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#ff6b6b" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#ff6b6b" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="#ff6b6b" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="400" stroke="#ff6b6b" stroke-width="0.5"/>
  </g>
  
  <!-- Floating particles / fireflies -->
  <g filter="url(#softglow)">
    <circle cx="150" cy="80" r="2" fill="#ff6b6b" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="320" r="1.5" fill="#f59e0b" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="60" r="2" fill="#ff6b6b" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="280" r="1.5" fill="#f59e0b" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="150" r="1" fill="#ff9999" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="350" r="1.5" fill="#ff6b6b" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="250" r="1" fill="#f59e0b" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="120" r="2" fill="#ff9999" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Butterfly 1 (large, left side) -->
  <g transform="translate(120, 180) scale(0.8) rotate(-15)" opacity="0.15" filter="url(#glow)">
    <path d="M0,0 C-20,-30 -50,-40 -40,-10 C-35,5 -15,10 0,0 Z" fill="#ff6b6b"/>
    <path d="M0,0 C20,-30 50,-40 40,-10 C35,5 15,10 0,0 Z" fill="#ff6b6b"/>
    <path d="M0,0 C-15,20 -35,30 -25,10 C-20,0 -10,-5 0,0 Z" fill="#ff4444"/>
    <path d="M0,0 C15,20 35,30 25,10 C20,0 10,-5 0,0 Z" fill="#ff4444"/>
    <line x1="0" y1="0" x2="0" y2="5" stroke="#ff6b6b" stroke-width="1"/>
  </g>
  
  <!-- Butterfly 2 (medium, right side) -->
  <g transform="translate(1050, 120) scale(0.6) rotate(20)" opacity="0.12" filter="url(#glow)">
    <path d="M0,0 C-20,-30 -50,-40 -40,-10 C-35,5 -15,10 0,0 Z" fill="#f59e0b"/>
    <path d="M0,0 C20,-30 50,-40 40,-10 C35,5 15,10 0,0 Z" fill="#f59e0b"/>
    <path d="M0,0 C-15,20 -35,30 -25,10 C-20,0 -10,-5 0,0 Z" fill="#d97706"/>
    <path d="M0,0 C15,20 35,30 25,10 C20,0 10,-5 0,0 Z" fill="#d97706"/>
  </g>
  
  <!-- Butterfly 3 (small, center-top) -->
  <g transform="translate(600, 50) scale(0.4) rotate(-5)" opacity="0.1" filter="url(#glow)">
    <path d="M0,0 C-20,-30 -50,-40 -40,-10 C-35,5 -15,10 0,0 Z" fill="#ff6b6b"/>
    <path d="M0,0 C20,-30 50,-40 40,-10 C35,5 15,10 0,0 Z" fill="#ff6b6b"/>
    <path d="M0,0 C-15,20 -35,30 -25,10 C-20,0 -10,-5 0,0 Z" fill="#ff4444"/>
    <path d="M0,0 C15,20 35,30 25,10 C20,0 10,-5 0,0 Z" fill="#ff4444"/>
  </g>
  
  <!-- Plum blossom 1 -->
  <g transform="translate(900, 300)" opacity="0.08">
    <circle cx="0" cy="-8" r="5" fill="#ff6b6b"/>
    <circle cx="7.6" cy="-2.5" r="5" fill="#ff6b6b"/>
    <circle cx="4.7" cy="6.5" r="5" fill="#ff6b6b"/>
    <circle cx="-4.7" cy="6.5" r="5" fill="#ff6b6b"/>
    <circle cx="-7.6" cy="-2.5" r="5" fill="#ff6b6b"/>
    <circle cx="0" cy="0" r="3" fill="#f59e0b"/>
  </g>
  
  <!-- Plum blossom 2 -->
  <g transform="translate(250, 320) scale(0.7)" opacity="0.06">
    <circle cx="0" cy="-8" r="5" fill="#ff9999"/>
    <circle cx="7.6" cy="-2.5" r="5" fill="#ff9999"/>
    <circle cx="4.7" cy="6.5" r="5" fill="#ff9999"/>
    <circle cx="-4.7" cy="6.5" r="5" fill="#ff9999"/>
    <circle cx="-7.6" cy="-2.5" r="5" fill="#ff9999"/>
    <circle cx="0" cy="0" r="3" fill="#f59e0b"/>
  </g>
  
  <!-- Decorative lines -->
  <rect x="100" y="195" width="400" height="1" fill="url(#accent)" opacity="0.3"/>
  <rect x="700" y="195" width="400" height="1" fill="url(#accent)" opacity="0.3"/>
  
  <!-- Corner decorations -->
  <g opacity="0.15">
    <path d="M20,20 L60,20 L60,24 L24,24 L24,60 L20,60 Z" fill="#ff6b6b"/>
    <path d="M1180,20 L1140,20 L1140,24 L1176,24 L1176,60 L1180,60 Z" fill="#ff6b6b"/>
    <path d="M20,380 L60,380 L60,376 L24,376 L24,340 L20,340 Z" fill="#ff6b6b"/>
    <path d="M1180,380 L1140,380 L1140,376 L1176,376 L1176,340 L1180,340 Z" fill="#ff6b6b"/>
  </g>
  
  <!-- Terminal window (left side) -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="380" height="220" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" opacity="0.9"/>
    <rect x="0" y="0" width="380" height="28" rx="8" fill="#161b22"/>
    <rect x="0" y="20" width="380" height="8" fill="#161b22"/>
    <circle cx="16" cy="14" r="5" fill="#ff5f56"/>
    <circle cx="32" cy="14" r="5" fill="#ffbd2e"/>
    <circle cx="48" cy="14" r="5" fill="#27c93f"/>
    <text x="190" y="18" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="11">kong.a@wangsheng: ~/profile</text>
    
    <text x="16" y="55" fill="#ff6b6b" font-family="monospace" font-size="12">$ whoami</text>
    <text x="16" y="75" fill="#c9d1d9" font-family="monospace" font-size="12">Kong.A · 往生堂第77代堂主候补</text>
    
    <text x="16" y="105" fill="#ff6b6b" font-family="monospace" font-size="12">$ cat philosophy.txt</text>
    <text x="16" y="125" fill="#c9d1d9" font-family="monospace" font-size="12">「生老病死，天地万象，</text>
    <text x="16" y="145" fill="#c9d1d9" font-family="monospace" font-size="12">  阴阳交替，此乃天道。」</text>
    
    <text x="16" y="175" fill="#ff6b6b" font-family="monospace" font-size="12">$ ./build.sh --target=ArasToolkit</text>
    <text x="16" y="195" fill="#27c93f" font-family="monospace" font-size="12">✓ 编译成功 · 蝴蝶已就位 🦋</text>
  </g>
  
  <!-- Main title (right side) -->
  <g transform="translate(750, 140)">
    <text x="0" y="0" fill="#8b949e" font-family="monospace" font-size="13" letter-spacing="4">&lt; HELLO WORLD, I AM /&gt;</text>
    <text x="0" y="60" fill="#e6edf3" font-family="sans-serif" font-size="56" font-weight="bold" letter-spacing="2">KONG<tspan fill="#ff6b6b">.</tspan><tspan fill="#f59e0b">A</tspan></text>
    <rect x="0" y="75" width="280" height="3" fill="url(#gold)" rx="1"/>
    <text x="0" y="105" fill="#8b949e" font-family="sans-serif" font-size="14" letter-spacing="1">把复杂需求，写成优雅的代码</text>
    <text x="0" y="130" fill="#484f58" font-family="monospace" font-size="11" letter-spacing="2">C# / .NET / WPF / ARAS / SQL SERVER</text>
    
    <!-- Status badges -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="140" height="26" rx="13" fill="none" stroke="#238636" stroke-width="1" opacity="0.6"/>
      <circle cx="16" cy="13" r="4" fill="#238636">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="17" fill="#c9d1d9" font-family="monospace" font-size="10">OPEN TO COLLAB</text>
      
      <rect x="155" y="0" width="110" height="26" rx="13" fill="none" stroke="#30363d" stroke-width="1"/>
      <text x="170" y="17" fill="#8b949e" font-family="monospace" font-size="10">CHINA · UTC+8</text>
    </g>
  </g>
  
  <!-- Bottom bar -->
  <rect x="0" y="385" width="1200" height="15" fill="#0d1117" opacity="0.8"/>
  <text x="30" y="396" fill="#484f58" font-family="monospace" font-size="9">PROFILE v2.0.0</text>
  <text x="1170" y="396" text-anchor="end" fill="#484f58" font-family="monospace" font-size="9">// 胡桃保佑，代码无bug 🦋</text>
  
  <!-- SYS_ONLINE indicator -->
  <g transform="translate(1100, 30)">
    <circle cx="0" cy="0" r="3" fill="#238636">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="4" fill="#484f58" font-family="monospace" font-size="10">SYS_ONLINE</text>
  </g>
</svg>