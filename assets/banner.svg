  <text x="1060" y="272" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="112" font-weight="800" letter-spacing="3"><tspan fill="#E8EEF7">KONG</tspan><tspan fill="#F59E0B">.</tspan><tspan fill="#38BDF8">A</tspan></text>

