<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 520" font-family="Consolas, 'Cascadia Code', 'JetBrains Mono', Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070D1B"/>
      <stop offset=".55" stop-color="#0A1424"/>
      <stop offset="1" stop-color="#081020"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".16"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#F59E0B" stop-opacity=".10"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#38BDF8" stop-opacity=".09"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#152238"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="u1"><rect x="880" y="290" width="360" height="8"/></clipPath>
    <clipPath id="t1"><rect x="90" y="160" width="0" height="28"><animate attributeName="width" from="0" to="560" begin="0.3s" dur="0.45s" fill="freeze"/></rect></clipPath>
    <clipPath id="t2"><rect x="90" y="190" width="0" height="28"><animate attributeName="width" from="0" to="560" begin="0.95s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect x="90" y="222" width="0" height="28"><animate attributeName="width" from="0" to="560" begin="1.8s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="t4"><rect x="90" y="252" width="0" height="28"><animate attributeName="width" from="0" to="560" begin="2.5s" dur="0.75s" fill="freeze"/></rect></clipPath>
    <clipPath id="t5"><rect x="90" y="284" width="0" height="28"><animate attributeName="width" from="0" to="560" begin="3.55s" dur="0.55s" fill="freeze"/></rect></clipPath>
    <clipPath id="t6"><rect x="90" y="316" width="0" height="30"><animate attributeName="width" from="0" to="560" begin="4.3s" dur="0.6s" fill="freeze"/></rect></clipPath>
